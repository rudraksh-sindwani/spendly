{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record a new expense</p>
        </div>

        <div class="auth-card">
            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="auth-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
            {% endfor %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" value="{{ form.amount or '' }}"
                           class="form-input" placeholder="0.00" step="0.01" min="0.01"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input expense-select" required>
                        <option value="" disabled {{ 'selected' if not form.category }}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {{ 'selected' if form.category == c }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ form.date or '' }}"
                           class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="expense-hint">(optional)</span></label>
                    <input type="text" id="description" name="description" value="{{ form.description or '' }}"
                           class="form-input" placeholder="e.g. Lunch" maxlength="200">
                </div>
                <div class="expense-form-actions">
                    <button type="submit" class="btn-submit">Save expense</button>
                    <a class="btn-ghost" href="{{ url_for('profile') }}">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
